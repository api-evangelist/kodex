          type: string
          format: binary
      required:
      - $file
    MessageCreatedBy:
      type: object
      properties:
        email:
          type: string
          description: Email address of the user who created the message
        name:
          type: string
          description: Name of the user who created the message
        role:
          type: string
          description: 'Role of the user who created the message

            Possible values:

            - `ANALYST`: Internal user who reviews and responds to law enforcement requests

            - `AGENT`: Law enforcement official who submitted the request'
      required:
      - name
      - role
    ExternalMessageResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique Kodex identifier (UUID) of the message
          example: 123e4567-e89b-12d3-a456-426614174000
        createdAt:
          format: date-time
          type: string
          description: Timestamp when the message was created in the UI or via the API, in ISO 8601 format
        updatedAt:
          format: date-time
          type: string
          description: Timestamp when the message was last modified, in ISO 8601 format
        $message:
          type: string
          description: Message content returned in HTML format
        actionType:
          type: string
          description: Request-related event during which the message was created
          example: COMMENT
        isRead:
          type: boolean
          description: Indicates whether the recipient has read the message
        hasAttachments:
          type: boolean
          description: Indicates whether the message has any attachments
        requestAttachmentIds:
          description: List of unique Kodex identifiers (UUIDs) for attachments associated with the message
          type: array
          items:
            type: string
        createdBy:
          description: Information about the user who created the message
          allOf:
          - $ref: '#/components/schemas/MessageCreatedBy'
      required:
      - id
      - createdAt
      - updatedAt
      - $message
      - actionType
      - isRead
      - hasAttachments
      - requestAttachmentIds
      - createdBy
    PaginatedResponseExternalMessageResponse:
      type: object
      properties:
        total:
          type: number
          description: Total number of results returned
          example: 101
        page:
          type: number
          description: Page number of the results
          example: 1
        pageLength:
          type: number
          description: Number of results returned per page
          example: 25
        data:
          type: array
          description: List of result objects returned by the query
          items:
            $ref: '#/components/schemas/ExternalMessageResponse'
      required:
      - total
      - page
      - pageLength
      - data
    LogEntry:
      type: object
      properties:
        timestamp:
          format: date-time
          type: string
          description: Timestamp when the log entry was created
          example: '2024-06-01T12:34:56.789Z'
        path:
          type: string
          description: API path that was accessed
          example: /v1/resource
        responseCode:
          type: number
          description: HTTP response code returned
          example: 200
        apiKeyFragment:
          type: string
          description: Reference of the API key used for the request
          example: ksk_zcxTosZJSLWwsuIxtQQG2Q
        userAgent:
          type: string
          description: User agent string from the request
          example: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)
        ipAddress:
          type: string
          description: IP address of the requester
          example: 192.168.1.1
        responseSize:
          type: string
          description: Size of the response in bytes
          example: 512
      required:
      - timestamp
      - path
      - responseCode
      - apiKeyFragment
      - userAgent
      - ipAddress
    GetLogsResponse:
      type: object
      properties:
        logs:
          description: Array of log entries returned by the query (maximum 1000 entries per response)
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        hasMore:
          type: boolean
          description: Whether there are more results to fetch
        cursor:
          type: string
          description: A cursor representing the position from which to start the search
      required:
      - logs
      - hasMore
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          description: Stable, monotonically increasing event id. A 64-bit integer serialized as a decimal
            string (it can exceed the safe JavaScript number range) — treat it as an opaque token.
          example: '10423'
        source:
          type: string
          description: Which system table the event came from
          example: REQUEST_ACTION
        eventType:
          type: string
          description: The action that occurred
          example: ATTACHMENT_DOWNLOAD
        timestamp:
          format: date-time
          type: string
          description: When the action occurred
          example: '2026-07-16T12:34:56.789Z'
        requestId:
          type: string
          description: Request the action was taken on
        requestNumber:
          type: string
          description: The request's human-readable number, or null if it has none yet
          example: REQ-1042
        actorUserId:
          type: string
          description: User who performed the action
        actorEmail:
          type: string
          description: Email of the acting user
        actorOrgId:
          type: string
          description: Acting user's organization
        targetId:
          type: string
          description: Target the action affected, if any
        ipAddress:
          type: string
          description: IP address of the actor. Included only for your own organization's users; null
            for external actors (e.g. a requesting agent), whose network signals are not exposed.
          example: 192.168.1.1
        fingerprintId:
          type: string
          description: Browser fingerprint of the actor. Included only for your own organization's users;
            null for external actors (e.g. a requesting agent).
        isSystemGenerated:
          type: boolean
          description: Whether the action was performed by the system
        metadata:
          type: object
          description: 'Non-sensitive, source-dependent event metadata, or null. For field-change events:
            `{ changedFields: string[] }`. For request actions: `{ isKapiGenerated, agentHasMfaEnabled
            }`.'
          nullable: true
      required:
      - id
      - source
      - eventType
      - timestamp
      - requestId
      - isSystemGenerated
    GetAuditEventsResponse:
      type: object
      properties:
        events:
          description: 'Audit events in ingestion order (ascending event id), which is the gapless order
            to page through. Note this is not necessarily `timestamp` order: an event that was ingested
            late gets a later id, so `timestamp` is not guaranteed monotonic within the feed.'
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        hasMore:
          type: boolean
          description: Whether there are more results to fetch
        cursor:
          type: string
          description: Cursor marking the last event returned
      required:
      - events
      - hasMore
    AuditActor:
      type: object
      properties:
        id:
          type: string
          description: Kodex identifier of the user who performed the action
        name:
          type: string
          description: Full name of the user who performed the action
        email:
          type: string
          description: Email of the user who performed the action
      required:
      - id
      - name
    AuditEntry:
      type: object
      properties:
        timestamp:
          format: date-time
          type: string
          description: When the action occurred
          example: '2026-06-01T12:34:56.789Z'
        action:
          type: string
          description: The action that was recorded
          example: REQUEST_VIEWED
        isSystemGenerated:
          type: boolean
          description: Whether the action was generated by the system rather than a user
        actor:
          description: The user who performed the action. Absent for system-generated actions.
          allOf:
          - $ref: '#/components/schemas/AuditActor'
      required:
      - timestamp
      - action
      - isSystemGenerated
    PaginatedResponseAuditEntry:
      type: object
      properties:
        total:
          type: number
          description: Total number of results returned
          example: 101
        page:
          type: number
          description: Page number of the results
          example: 1
        pageLength:
          type: number
          description: Number of results returned per page
          example: 25
        data:
          type: array
          description: List of result objects returned by the query
          items:
            $ref: '#/components/schemas/AuditEntry'
      required:
      - total
      - page
      - pageLength
      - data
