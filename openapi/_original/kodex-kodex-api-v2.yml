openapi: 3.0.0
paths:
  /v2/check:
    get:
      operationId: CheckControllerV2_getHealthCheck
      summary: Check API health
      description: Check that the API is alive, without authentication.
      parameters: []
      responses:
        '200':
          description: Data fetched successfully
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
      tags:
      - Service
  /v2/config/request:
    get:
      operationId: ConfigsControllerV2_genRequestConfigs
      summary: Get request configuration
      description: Retrieves configuration fields for a specific type of law enforcement request
      parameters:
      - description: 'Kind of law enforcement request for which to return the configuration fields


          Possible values:

          - `RECORDS`: Request for user data or content under legal authority

          - `PRESERVATION`: Request to retain data for future legal access

          - `INQUIRY`: General question or clarification submitted by the requestor'
        name: type
        in: query
        required: true
        schema:
          enum:
          - RECORDS
          - PRESERVATION
          - INQUIRY
          type: string
      responses:
        '200':
          description: The request config was successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestConfigResponse'
        '403':
          description: "The provided API key\n    was incorrect or the request was not found."
      tags:
      - Configs
      security:
      - api-key: []
  /v2/config/target:
    get:
      operationId: ConfigsControllerV2_getTargetConfigs
      summary: Get target configuration
      description: Retrieves target field configurations
      parameters: []
      responses:
        '200':
          description: The target config was successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetConfigResponse'
        '403':
          description: "The provided API key\n    was incorrect or the request was not found."
      tags:
      - Configs
      security:
      - api-key: []
  /v2/request:
    get:
      operationId: RequestControllerV2_getManyRequests
      summary: List all requests
      description: Call this endpoint to list all requests that fit the query
      parameters:
      - description: Page number of the results
        required: false
        name: page
        in: query
        schema:
          default: 1
          type: number
      - description: Number of results returned per page
        required: false
        name: pageLength
        in: query
        schema:
          minimum: 5
          maximum: 100
          default: 25
          type: number
      - description: 'Specifies the field and direction used to order the results


          This has the format `sort=field:asc|desc`. Results can only be sorted by `createdAt` to order
          results by submission time in ascending or descending order.'
        required: false
        name: sort
        in: query
        schema:
          default: createdAt:asc
          type: string
      - description: Filters requests created on and after the given timestamp (ISO 8601 format)
        required: false
        name: since
        in: query
        schema:
          type: string
      - description: Filters requests by the current phase in the processing workflow
        required: false
        name: status
        in: query
        schema:
          type: string
      - description: Excludes requests by the current phase in the processing workflow
        required: false
        name: statusNot
        in: query
        schema:
          type: string
      - description: Filters requests based on the review status of the target (object of inquiry)
        required: false
        name: target.status
        in: query
        schema:
          type: string
      - description: Excludes requests based on the review status of the target (object of inquiry)
        required: false
        name: target.statusNot
        in: query
        schema:
          type: string
      - description: Filters requests based on the type of the target (object of inquiry)
        required: false
        name: target.type
        in: query
        schema:
          type: string
      - description: Excludes requests based on the type of the target (object of inquiry)
        required: false
        name: target.typeNot
        in: query
        schema:
          type: string
      - description: Filters requests by values assigned to their associated tags
        required: false
        name: tags
        in: query
        schema:
          type: string
      - description: Excludes requests by values assigned to their associated tags
        required: false
        name: tagsNot
        in: query
        schema:
          type: string
      - description: Filters requests based on the lookupResponseType of the target (object of inquiry)
        required: false
        name: target.lookupResponseType
        in: query
        schema:
          type: string
      - description: Filters requests by the ID of their associated eEvidence authorization
        required: false
        name: eevidenceAuthorizationId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: The request was successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponseListRequestResponse'
        '400':
          description: Invalid parameter
        '403':
          description: The provided API key was incorrect.
      tags:
      - Requests
      security:
      - api-key: []
  /v2/request/{requestId}:
    get:
      operationId: RequestControllerV2_getOneRequest
      summary: Get information about a request
      description: Call this endpoint to get information about a request.
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      responses:
        '200':
          description: The request was successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRequestV2Response'
        '400':
          description: Request ID is not a valid uuid
        '403':
          description: Forbidden resource
        '404':
          description: Request not found
      tags:
      - Requests
      security:
      - api-key: []
    patch:
      operationId: RequestControllerV2_updateRequest
      summary: Update information about a request
      description: Call this endpoint to update information in a request.
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRequestClass'
      responses:
        '200':
          description: The request was successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRequestV2Response'
        '400':
          description: Request ID is not a valid uuid
        '403':
          description: Forbidden resource
        '404':
          description: Request not found
      tags:
      - Requests
      security:
      - api-key: []
  /v2/request/{requestId}/target:
    get:
      operationId: TargetsControllerV2_getTarget
      summary: List all targets for a request
      description: Call this endpoint to get the target selector and identifier for a request
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      - description: Page number of the results
        required: false
        name: page
        in: query
        schema:
          default: 1
          type: number
      - description: Number of results returned per page
        required: false
        name: pageLength
        in: query
        schema:
          minimum: 5
          maximum: 100
          default: 25
          type: number
      - description: 'Specifies the field and direction used to order the results


          This has the format `sort=field:asc|desc`. Results can only be sorted by `createdAt` to order
          results by submission time in ascending or descending order.'
        required: false
        name: sort
        in: query
        schema:
          default: createdAt:asc
          type: string
      responses:
        '200':
          description: The target information was successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponseTarget'
        '400':
          description: Invalid parameter
        '403':
          description: The provided API key was incorrect.
      tags:
      - Targets
      security:
      - api-key: []
    post:
      operationId: TargetsControllerV2_addTarget
      summary: Add target selector to a request
      description: Call this endpoint to add a target selector and associated identifiers to a request
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequestTargetRequestClass'
      responses:
        '201':
          description: The target was successfully added to the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '403':
          description: "The provided API key\n      was incorrect or the request was not found."
      tags:
      - Targets
      security:
      - api-key: []
  /v2/request/{requestId}/target/lookup:
    post:
      operationId: TargetsControllerV2_bulkTargetLookup
      summary: Bulk add target lookup response to a request
      description: 'Call this endpoint to add the results for multiple target lookups related to the same
        request. This will add and associate target selectors and identifiers.


        > 🚧 A maximum of 25 lookups may be submitted in a single request.'
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostBulkTargetLookupRequestClass'
      responses:
        '201':
          description: The target lookup responses were successfully added to the request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Target'
        '403':
          description: "The provided API key\n        was incorrect or the request was not found."
      tags:
      - Targets
      security:
      - api-key: []
  /v2/request/{requestId}/target/{targetId}/lookup:
    post:
      operationId: TargetsControllerV2_addTargetLookup
      summary: Add target lookup response to a request
      description: Call this endpoint to add the results of a target lookup. This will add and associate
        target selectors and identifiers.
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      - name: targetId
        required: true
        in: path
        description: Unique Kodex identifier of the target
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequestTargetLookupRequestClass'
      responses:
        '201':
          description: The target lookup response was successfully added to the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '403':
          description: "The provided API key\n        was incorrect or the request was not found."
      tags:
      - Targets
      security:
      - api-key: []
  /v2/request/{requestId}/target/{targetId}/identifier/{identifierId}:
    patch:
      operationId: TargetsControllerV2_updateIdentifier
      summary: Update a target identifier
      description: Call this endpoint to update the identifier on a target
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      - name: targetId
        required: true
        in: path
        description: Unique Kodex identifier of the target
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      - name: identifierId
        required: true
        in: path
        description: Unique Kodex identifier of the identifier
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchIdentifierClass'
      responses:
        '200':
          description: The identifier was successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetIdentifier'
        '403':
          description: The provided API key was incorrect.
      tags:
      - Targets
      security:
      - api-key: []
  /v2/request/{requestId}/attachment:
    get:
      operationId: AttachmentControllerV2_getAttachments
      summary: Fetch attachments
      description: Retrieves a list of documents associated with a law enforcement request
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      - name: page
        required: false
        in: query
        description: Page number of the results
        schema:
          default: 1
          type: number
      - name: pageLength
        required: false
        in: query
        description: Number of results returned per page
        schema:
          minimum: 5
          maximum: 100
          default: 25
          type: number
      - name: sort
        required: false
        in: query
        description: 'Specifies the field and direction used to order the results


          This has the format `sort=field:asc|desc`. Results can only be sorted by `createdAt` to order
          results by submission time in ascending or descending order.'
        schema:
          default: createdAt:asc
          type: string
      - name: isUploaded
        required: false
        in: query
        description: 'Indicates whether the file blob is currently stored in the Kodex system


          NOTE: Files may be unavailable due to upload failures or scheduled deletions based on customer-defined
          retention periods.


          If the file does not exist, the download endpoint will return a 404 or 410 error code.'
        schema:
          type: boolean
      responses:
        '200':
          description: A paginated list of attachments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponseAttachmentPostResponse'
        '403':
          description: "The attachment was not downloaded because the provided API key\n      was incorrect."
      tags:
      - Attachments
      security:
      - api-key: []
  /v2/request/{requestId}/attachment/{attachmentId}:
    get:
      operationId: AttachmentControllerV2_getAttachment
      summary: Get metadata about an attachment
      description: Verifies the SHA of an uploaded attachment for integrity validation.
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      - name: attachmentId
        required: true
        in: path
        description: Unique Kodex identifier of the attachment
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      responses:
        '200':
          description: The attachment was successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentPostResponse'
        '403':
          description: "The attachment metadata was not returned because the provided API key\n      was\
            \ incorrect."
      tags:
      - Attachments
      security:
      - api-key: []
  /v2/request/{requestId}/attachment/{attachmentId}/download:
    get:
      operationId: AttachmentControllerV2_downloadAttachment
      summary: Download a request attachment
      description: Downloads a specific document associated with a law enforcement request
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      - name: attachmentId
        required: true
        in: path
        description: Unique Kodex identifier of the attachment
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      responses:
        '200':
          description: The file was downloaded successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              schema:
                type: string
              description: MIME type of the file indicating its format
            Content-Length:
              schema:
                type: number
              description: Size of the file in bytes
            Content-Disposition:
              schema:
                type: string
              description: Specifies that the file should be downloaded as an attachment and includes
                the filename
        '403':
          description: "The attachment was not downloaded because the provided API key\n      was incorrect."
        '404':
          description: The attachment data does not exist.
        '410':
          description: The attachment data has been deleted.
      tags:
      - Attachments
      security:
      - api-key: []
  /v2/request/{requestId}/attachment/upload:
    post:
      operationId: AttachmentControllerV2_uploadAttachment
      summary: Upload an attachment
      description: Uploads a file to a law enforcement request
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostRequestAttachmentUploadClass'
      responses:
        '201':
          description: The attachment was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentPostResponse'
        '403':
          description: "The request was not updated because the provided API key\n    was incorrect."
        '413':
          description: The file was too large (50GB limit)
      tags:
      - Attachments
      security:
      - api-key: []
  /v2/request/{requestId}/message:
    get:
      operationId: MessagesControllerV2_getExternalMessages
      summary: List all external messages
      description: Retrieves a complete list of external messages for a request
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      - description: Page number of the results
        required: false
        name: page
        in: query
        schema:
          default: 1
          type: number
      - description: Number of results returned per page
        required: false
        name: pageLength
        in: query
        schema:
          minimum: 5
          maximum: 100
          default: 25
          type: number
      - description: 'Specifies the field and direction used to order the results


          This has the format `sort=field:asc|desc`. Results can only be sorted by `createdAt` to order
          results by submission time in ascending or descending order.'
        required: false
        name: sort
        in: query
        schema:
          default: createdAt:asc
          type: string
      responses:
        '200':
          description: The external message information was successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponseExternalMessageResponse'
        '400':
          description: Invalid parameter
        '403':
          description: The provided API key was incorrect.
      tags:
      - Messages
      security:
      - api-key: []
  /v2/request/{requestId}/message/{messageId}:
    get:
      operationId: MessagesControllerV2_getExternalMessage
      summary: Get a single external message
      description: Retrieves a single external message for a request
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      - name: messageId
        required: true
        in: path
        description: Unique Kodex identifier of the message
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      responses:
        '200':
          description: The external message information was successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMessageResponse'
        '400':
          description: Invalid parameter
        '403':
          description: The provided API key was incorrect.
        '404':
          description: Message not found
      tags:
      - Messages
      security:
      - api-key: []
  /v2/logs/kapi:
    get:
      operationId: LogsController_getLogs
      summary: Retrieve access logs for KAPI
      description: 'Returns a list of KAPI access logs for your organization.


        All API keys in your organization are included. In future updates, results may be limited based
        on the API key''s scope.


        If a cursor is not provided, the endpoint will return the {limit} most recent logs.'
      parameters:
      - description: A cursor representing the position from which to start the search. To get the latest
          provide 'LATEST'
        required: false
        name: cursor
        in: query
        schema:
          type: string
      - description: Maximum number of logs to return (50 - 1000). May return less than the limit if there
          are no further logs.
        required: false
        name: limit
        in: query
        schema:
          minimum: 50
          maximum: 1000
          default: 500
          type: number
      responses:
        '200':
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLogsResponse'
        '400':
          description: Invalid parameter
        '403':
          description: The provided API key was incorrect
      tags:
      - Service
      security:
      - api-key: []
  /v2/logs/request:
    get:
      operationId: LogsController_getRequestAuditEvents
      summary: Stream request audit events
      description: 'Returns a cursor-paginated feed of actions taken on your organization''s requests

        (views, downloads, edits, target changes) for ingestion into a SIEM. Events carry no sensitive

        content — only the action, actor, request, and actor signal such as IP address.


        A parent-org key streams events for the parent and all active child orgs; any other key streams

        only its own org. Events lag live activity by up to several minutes. If a cursor is not provided,

        the endpoint returns the {limit} most recent events and only tails forward from there — to ingest

        all existing history, make the first call with cursor ''EARLIEST_AVAILABLE''.'
      parameters:
      - description: A cursor marking where to resume. Provide 'LATEST' for the most recent events, or
          the cursor returned by a previous response.
        required: false
        name: cursor
        in: query
        schema:
          type: string
      - description: Maximum number of events to return (50 - 1000).
        required: false
        name: limit
        in: query
        schema:
          minimum: 50
          maximum: 1000
          default: 500
          type: number
      responses:
        '200':
          description: Audit events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuditEventsResponse'
        '400':
          description: Invalid parameter
        '403':
          description: The provided API key was incorrect
      tags:
      - Service
      security:
      - api-key: []
  /v2/request/{requestId}/audit:
    get:
      operationId: AuditControllerV2_getRequestAuditLog
      summary: Get the audit log for a request
      description: 'Returns the audit stream for a request: user actions and target events unified into
        actor, timestamp, and action, ordered by ascending timestamp.'
      parameters:
      - name: requestId
        required: true
        in: path
        description: Unique Kodex identifier of the request
        schema:
          example: 123e4567-e89b-42d3-a456-426614174000
          type: string
      - description: Page number of the results
        required: false
        name: page
        in: query
        schema:
          default: 1
          type: number
      - description: Number of entries returned per page
        required: false
        name: pageLength
        in: query
        schema:
          minimum: 5
          maximum: 100
          default: 25
          type: number
      responses:
        '200':
          description: The audit log was successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponseAuditEntry'
        '400':
          description: Invalid parameter
        '403':
          description: The provided API key was incorrect.
        '404':
          description: Request not found
      tags:
      - Requests
      security:
      - api-key: []
info:
  title: Kodex API V2
  description: Secure API for interacting with Kodex requests. This documentation is intended for exploratory
    understanding of the API.
  version: 2.0.0
  contact: {}
  x-source-url: https://dash.readme.com/api/v1/api-registry/5l4ot1fdms7ss6wc
  x-documentation-url: https://docs.kodexapi.com/
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
tags: []
servers:
- url: https://api.demo.kodexglobal.com
  description: Demo Server
components:
  securitySchemes:
    api-key:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Credential used to authenticate and authorize access to the Kodex Verification API


        Learn how to [create an API key](https://docs.kodexapi.com/verifications/reference/generate-and-manage-keys).'
  schemas:
    ListConfigResponse:
      type: object
      properties:
        label:
          type: string
          description: Identifier for the customization field, used to reference the field in the UI or
            API
          example: informationRequested
        options:
          description: List of selectable values available for the customization field, if applicable
          example:
          - Subscriber Information
          - Basic Account Details
          - Message Content
          type: array
          items:
            type: string
        variant:
          type: string
          description: 'Describes the type of customization field, indicating how its value was collected
            or structured.


            Possible values:

            - `SingleOption`: Single value selected from the provided options

            - `MultiOption`: Multiple values selected from the provided options

            - `Text`: Free-form text value

            - `Date`: Date in YYYY-MM-DD format

            - `CountrySelect`: Country name selected from a predefined list'
          enum:
