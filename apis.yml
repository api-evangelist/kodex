aid: kodex
name: Kodex
description: 'Kodex (Albatross Technologies) operates the Kodex Global Network, a platform
  for managing law enforcement and government data requests — subpoenas, warrants, and
  emergency disclosure requests — for crypto exchanges, fintechs, banks, and telecommunications
  companies. The platform covers request intake and automation, requester verification
  against a network of 15K+ government agencies, threat intelligence, encrypted data
  production and delivery, cost recovery, and transparency reporting. Kodex exposes the
  same network programmatically through the Kodex API: a Verification API for real-time
  requester lookups, a Targets (Data Production) API for automating production on verified
  requests, and status webhooks for agent credential changes. Developer documentation is
  published on ReadMe at docs.kodexapi.com as two projects — Request Portal and Verifications
  API — both authenticated with scoped organization API keys sent in an X-API-Key header.'
