apis:
- aid: kodex:verification-api
  name: Kodex Verification API
  description: >-
    Real-time verification of law enforcement requesters. Pass a requester email address to the lookup
    endpoint and receive the agent's standing, their agency's status, and the domain's risk level, checked
    against the Kodex Global Network in real time. Published endpoint: POST /v1/verification/lookup. Authenticated
    with a scoped organization API key sent in an X-API-Key header.
  humanURL: https://docs.kodexapi.com/verifications/reference/
  baseURL: https://app.kodexglobal.com
  tags:
  - Verification
  - Identity
  - Law Enforcement
  - Risk
  properties:
  - type: Documentation
    url: https://docs.kodexapi.com/verifications/reference/
  - type: APIReference
    url: https://docs.kodexapi.com/verifications/reference/
  - type: Authentication
    url: authentication/kodex-authentication.yml
- aid: kodex:request-portal-api
  name: Kodex Request Portal API
  description: >-
    The Request Portal (Targets / Data Production) API creates and manages data requests and automates
    producing data on verified requests — targets, attachments, and messages. Published endpoint: GET
    /v1/requests/{request_id}/targets. Drafts surface for review before they leave your environment, and
    every call writes to the same audit trail as the Kodex application. Authenticated with a scoped organization
    API key sent in an X-API-Key header.
  humanURL: https://docs.kodexapi.com/request-portal/reference/request-api
  baseURL: https://app.kodexglobal.com
  tags:
